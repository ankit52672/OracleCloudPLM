[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oracle-cloud-plm-mcp"
version = "0.1.0"
description = "Read-only MCP example for Oracle Cloud PLM REST APIs"
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.9,<2",
]

[project.scripts]
oracle-cloud-plm-mcp = "oracle_cloud_plm_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oracle_cloud_plm_mcp"]

